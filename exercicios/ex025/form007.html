<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            text-transform: capitalize;

        }
        form{
            width: 400px;
            margin: auto;

        }
        fieldset{
            padding: 10px;
        }
        h1{
            text-transform: uppercase;
            text-align: center;
        }
    </style>
    <title>select e datalist</title>
</head>
<body>
    <h1>select and datalist</h1><br>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>lista de dados</legend>
            <p><label for="idprovincias">provincias:</label>
                <select name="provincia" id="idprovincias">
                    <option value="" selected>selecione sua provincia</option>
                    <option value="benguela">benguela</option>
                    <option value="luanda">luandda</option>
                    <option value="huambo">huambo</option>
                    <option value="kwanza-sul">kwanza-sul</option>
                    <option value="kwanza-nort">kwanza-norte</option>
                    <option value="lubango">lubango</option>
                    <option value="kuando kubango">kwando kubango</option>
                    <option value="">zaire</option>
                    <option value="">moxico</option>
                    <option value="">huila</option>
                </select>
            </p><br>
            <p>
                <label for="manos">amigos:</label>
                <input type="text" name="amigo" id="manos" list="idputos">

                <datalist id="idputos">
                    <option value="helvio">helvio</option>
                    <option value="rick">rick</option>
                    <option value="dercio">dercio</option>
                    <option value="manjiro">manjiro</option>
                    <option value="erishel ">erishel</option>
                </datalist>
            </p><br>
            <p><label for="sms">mensagem:</label>
                <textarea name="mensagen" id="sms"></textarea>
            </p>
        </fieldset>
        <input type="reset" value="limpar">
        <input type="submit" value="enviar">
    </form>
</body>
</html>
