<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>email e numero de celular</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        fieldset{
            width: 60%;
            height: 200px;
            padding: 10px;
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>formulario de celular e email</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>numero e email</legend>
            <p><label for="email">Nome:</label>
                <input type="email" id="email" autocomplete="email" required placeholder="email">
            </p>
            <p>
                <label for="n-tel">Numero: </label>
                 <input type="tel" minlength="9" required autocomplete="" id="n-tel" maxlength="9" placeholder="" inputmode="numeric">
            </p>
        </fieldset>
        <input type="submit" value="login">
        <input type="reset">
    </form>
</body>
</html>
