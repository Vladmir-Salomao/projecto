<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>centralizar conteudo sem flexbox</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        div{
            background: url(imagens/target001.png) no-repeat center/cover;
        }
        #a{
            width: 200px;
            height: 200px;
            background-color: rebeccapurple;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        #b{
            background-color: yellow;
            height:100vh;
            
        }
    </style>
</head>
<body>
    <div id="b">
        <div id="a"></div>
    </div>
</body>
</html>
