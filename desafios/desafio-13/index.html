<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stilo/stylo.css">
    <title>tabela do desafio</title>
</head>
<body>
    <table>

      <tr class="1">
        <td>1</td>
        <td>2</td>
        <td rowspan="2">3</td>
        <td>4</td>
      </tr>

      <tr class="2">
        <td>5</td>
        <td>6</td>
        <td>7</td>
      </tr>

      <tr class="3">
        <td colspan="3">8</td>
        <td>9</td>
      </tr>

      <tr class="4">
        <td rowspan="2">10</td>
        <td colspan="2">11</td>
        <td>12</td>
      </tr>
      
      <tr>
        <td>13</td>
        <td>14</td>
        <td>15</td>
      </tr>
      
    </table>
</body>
</html>
